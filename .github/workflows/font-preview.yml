name: font-preview
on:
  push:
    branches: [font-preview]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p /tmp/out && cp node_modules/galmuri/dist/galmuri.css node_modules/galmuri/dist/*.woff2 /tmp/out/
          cd /tmp/out && git init -q -b font-assets && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm fonts
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" font-assets
